<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login - ReplitStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Circles */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 15s infinite ease-in-out;
        }

        body::before {
            width: 300px;
            height: 300px;
            top: -150px;
            right: -100px;
            animation-delay: 0s;
        }

        body::after {
            width: 400px;
            height: 400px;
            bottom: -200px;
            left: -150px;
            animation-delay: 5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .login-header h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            font-weight: 700;
        }

        .login-header p {
            color: #666;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            color: #999;
            font-size: 1.1rem;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            color: #999;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.3s;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: linear-gradient(135deg, #fee 0%, #fdd 100%);
            color: #c33;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #fbb;
            animation: shake 0.5s ease;
        }

        .error-msg.active {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e0e0e0;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            color: #764ba2;
            transform: translateX(-5px);
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Security Badge */
        .security-badge {
            text-align: center;
            margin-top: 1rem;
            padding: 0.75rem;
            background: linear-gradient(135deg, #f0f0f0 0%, #e8e8e8 100%);
            border-radius: 10px;
            font-size: 0.85rem;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .security-badge i {
            color: #667eea;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #667eea;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            animation: slideDown 0.3s ease;
        }

        .toast.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ================== RESPONSIVE DESIGN ================== */

        /* Small Mobile (320px - 375px) */
        @media (max-width: 375px) {
            .login-container {
                padding: 2rem 1.5rem;
                border-radius: 16px;
                margin: 0.5rem;
            }

            .logo-icon {
                font-size: 2.5rem;
            }

            .login-header h1 {
                font-size: 1.6rem;
            }

            .login-header p {
                font-size: 0.85rem;
            }

            .form-group input,
            .login-btn {
                padding: 0.9rem 0.9rem 0.9rem 2.8rem;
                font-size: 0.95rem;
            }

            .form-group label {
                font-size: 0.9rem;
            }

            .input-icon {
                font-size: 1rem;
                left: 0.9rem;
            }

            .password-toggle {
                right: 0.9rem;
                font-size: 1rem;
            }

            body::before,
            body::after {
                display: none;
            }
        }

        /* Mobile (376px - 480px) */
        @media (min-width: 376px) and (max-width: 480px) {
            .login-container {
                padding: 2.2rem 1.8rem;
                border-radius: 18px;
            }

            .logo-icon {
                font-size: 2.8rem;
            }

            .login-header h1 {
                font-size: 1.8rem;
            }

            .login-header p {
                font-size: 0.9rem;
            }

            .form-group input,
            .login-btn {
                padding: 0.95rem 0.95rem 0.95rem 2.9rem;
                font-size: 0.98rem;
            }
        }

        /* Tablets (481px - 768px) */
        @media (min-width: 481px) and (max-width: 768px) {
            .login-container {
                padding: 3rem 2.5rem;
                max-width: 450px;
            }

            .logo-icon {
                font-size: 3.5rem;
            }

            .login-header h1 {
                font-size: 2.2rem;
            }

            .login-header p {
                font-size: 1rem;
            }
        }

        /* Desktop (769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
            .login-container {
                padding: 3.2rem 2.8rem;
                max-width: 480px;
            }

            .logo-icon {
                font-size: 3.8rem;
            }

            .login-header h1 {
                font-size: 2.4rem;
            }
        }

        /* Large Desktop (1024px+) */
        @media (min-width: 1025px) {
            .login-container {
                padding: 3.5rem 3rem;
                max-width: 500px;
            }

            .logo-icon {
                font-size: 4rem;
            }

            .login-header h1 {
                font-size: 2.5rem;
            }

            .login-header p {
                font-size: 1.05rem;
            }

            .form-group input {
                padding: 1.1rem 1.1rem 1.1rem 3.2rem;
                font-size: 1.05rem;
            }

            .login-btn {
                padding: 1.1rem;
                font-size: 1.15rem;
            }
        }

        /* Landscape Mobile */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 0.5rem;
            }

            .login-container {
                padding: 1.5rem;
                max-height: 95vh;
                overflow-y: auto;
            }

            .login-header {
                margin-bottom: 1rem;
            }

            .logo-icon {
                font-size: 2rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-group {
                margin-bottom: 1rem;
            }

            .back-link {
                margin-top: 1rem;
                padding-top: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1>Admin Login</h1>
            <p>Admin Panel में login करें</p>
        </div>

        <div class="error-msg" id="errorMsg">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username:
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input 
                        type="text" 
                        id="username" 
                        required 
                        autocomplete="username" 
                        placeholder="Enter username"
                        aria-label="Username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password:
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        autocomplete="current-password" 
                        placeholder="Enter password"
                        aria-label="Password">
                    <i class="fas fa-eye password-toggle" id="passwordToggle" onclick="togglePassword()"></i>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span id="loginBtnText">Login</span>
            </button>
        </form>

        <div class="security-badge">
            <i class="fas fa-shield-check"></i>
            <span>Secure Admin Access</span>
        </div>

        <div class="back-link">
            <a href="/">
                <i class="fas fa-arrow-left"></i>
                वापस Main Site पर जाएं
            </a>
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordToggle.classList.remove('fa-eye');
                passwordToggle.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordToggle.classList.remove('fa-eye-slash');
                passwordToggle.classList.add('fa-eye');
            }
        }

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'success' ? '#667eea' : '#c33';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            
            // Hide previous error
            errorMsg.classList.remove('active');
            
            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtnText.textContent = 'Logging in...';
            loginBtn.innerHTML = '<div class="loading-spinner"></div><span>Logging in...</span>';
            
            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Success animation
                    loginBtn.innerHTML = '<i class="fas fa-check-circle"></i><span>Login Successful!</span>';
                    loginBtn.style.background = 'linear-gradient(135deg, #00C851 0%, #007E33 100%)';
                    showToast('Login Successful! Redirecting...', 'success');
                    
                    // Redirect after short delay
                    setTimeout(() => {
                        window.location.href = '/admin/dashboard';
                    }, 1000);
                } else {
                    // Show error
                    errorText.textContent = data.error || 'Invalid username या password! कृपया दोबारा कोशिश करें।';
                    errorMsg.classList.add('active');
                    
                    // Reset button
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Login</span>';
                    loginBtn.disabled = false;
                    
                    // Shake animation
                    errorMsg.style.animation = 'none';
                    setTimeout(() => {
                        errorMsg.style.animation = 'shake 0.5s ease';
                    }, 10);
                }
            } catch (error) {
                console.error('Login error:', error);
                errorText.textContent = 'Network Error: कृपया इंटरनेट कनेक्शन चेक करें।';
                errorMsg.classList.add('active');
                
                // Reset button
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Login</span>';
                loginBtn.disabled = false;
                
                showToast('Connection Error!', 'error');
            }
        }

        // Auto-focus username field on page load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').focus();
        });

        // Enter key support for password toggle
        document.getElementById('passwordToggle').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                togglePassword();
            }
        });
    </script>
</body>
</html>
